name: CI

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff mypy types-requests

    - name: Security audit (pip-audit)
      run: pip-audit

    - name: Lint with ruff
      run: ruff check . --ignore=E501,F841

    - name: Type check with mypy
      run: mypy filter_app/ --ignore-missing-imports --follow-imports=skip

    - name: Run unit tests
      run: python -m pytest tests/unit/ --cov=filter_app --cov-report=term --cov-fail-under=55 --tb=short -q

    - name: Run integration tests
      run: python -m pytest tests/integration/ --cov=filter_app --cov-append --tb=short -q

    - name: Run E2E tests
      run: python -m pytest tests/e2e/ --cov=filter_app --cov-append -q --tb=short
