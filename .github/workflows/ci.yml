name: CI

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install "ruff>=0.11"
      - run: ruff check .
      - name: Check test imports
        run: python scripts/check_test_imports.py
      - name: Validate CI test file references
        run: |
          grep -oE "tests/test_[a-zA-Z0-9_]+\.py" .github/workflows/ci.yml | sort -u | while read f; do
            [ -f "$f" ] || echo "::warning::CI references missing file: $f"
          done

  lock-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-tools
      - run: |
          pip-compile --output-file=/tmp/requirements.lock.ci filter/requirements.txt --quiet
          if ! diff -q requirements.lock /tmp/requirements.lock.ci > /dev/null 2>&1; then
            echo "::error::requirements.lock is stale. Run 'make lock' to update."
            diff requirements.lock /tmp/requirements.lock.ci || true
            exit 1
          fi
          echo "requirements.lock is up-to-date"

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-
      - run: pip install -r filter/requirements.txt
      - run: pip install "mypy>=2.0" types-requests types-pyyaml
      - run: mypy filter/ --ignore-missing-imports --follow-imports=skip

  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: pip install -r filter/requirements.txt pytest pytest-cov
      # <6s: fast unit tests per TEST_TIMES.md
      - run: >
          python -m pytest tests/test_param_export_import.py
          tests/test_state.py tests/test_integration_flows.py
          tests/test_preset_ui_actions.py tests/test_data_loader.py
          tests/test_config_db.py tests/test_alignment.py
          tests/test_constants.py tests/test_config.py
          tests/test_filters.py tests/test_db.py
          tests/test_app_smoke.py -m "not slow" -q --tb=short
          --junitxml=fast-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-report-${{ matrix.python-version }}
          path: fast-test-results.xml

  medium-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: pip install -r filter/requirements.txt pytest pytest-cov pytest-xdist pytest-rerunfailures
      # <30s: integration tests, can run in parallel via xdist; flaky detection via rerunfailures
      - run: >
          python -m pytest tests/test_signals.py tests/test_sidebar.py
          tests/test_integration.py tests/test_strategy.py
          tests/test_boundary.py tests/test_streamlit_app.py
          tests/test_preset_ui.py tests/test_charts.py
          tests/test_chart_builder.py tests/test_backtest_cli.py
          tests/test_benchmark.py tests/test_p0_cache.py
          tests/test_p2_cleanup.py tests/test_render_traces.py
          tests/test_html_overlay.py tests/test_feedback_subplot.py
          tests/test_subplot_layout.py
          -m "not slow" -n auto -q --tb=short
          --reruns 1 --reruns-delay 2
          --junitxml=medium-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-test-report-${{ matrix.python-version }}
          path: medium-test-results.xml

  random-order-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r filter/requirements.txt pytest pytest-randomly
      - run: python -m pytest tests/test_engine.py tests/test_charts.py tests/test_parquet_store.py tests/test_backtest_cutoff.py -q --tb=short

  snapshot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install syrupy pytest
      - run: pip install -r requirements.lock 2>/dev/null || true
      - run: python -m pytest tests/test_snapshots.py --tb=short -q

  slow-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: pip install -r filter/requirements.txt pytest pytest-cov
      # ~101s: heavy tests (backtest, pipeline, UI) per TEST_TIMES.md
      - run: >
          python -m pytest tests/test_backtest.py
          tests/test_parquet_store.py tests/test_cascading_synthesis.py
          tests/test_pipeline_capture.py tests/test_data_recording.py
          tests/test_app_ui.py tests/test_view_backtest_multiticker.py
          -q --tb=short
          --junitxml=slow-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-report-${{ matrix.python-version }}
          path: slow-test-results.xml

  test-summary:
    runs-on: ubuntu-latest
    needs: [fast-tests, medium-tests, slow-tests]
    if: always()
    steps:
      - name: Publish test summary
        uses: dorny/test-reporter@v1
        with:
          name: pytest-results
          path: '*-test-results.xml'
          reporter: java-junit

  coverage:
    runs-on: ubuntu-latest
    needs: [fast-tests, medium-tests, slow-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-${{ hashFiles('filter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-coverage-
      - run: pip install -r filter/requirements.txt pytest pytest-cov
      - run: python -m pytest tests/ --ignore=tests/test_app_ui.py
               --cov=filter --cov-report=term
               --cov-fail-under=75 -q --tb=short

  changelog-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG was updated
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q CHANGELOG.md || \
            (echo "::error::PR must update CHANGELOG.md. Run 'make changelog' and commit the result." && exit 1)

  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    runs-on: ubuntu-latest
    needs: [fast-tests, medium-tests, slow-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
