[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-research"
version = "3.5.0"
description = "多周期股票滤波分析工具"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57",
    "loguru>=0.7",
    "numpy>=2.2",
    "scipy>=1.17",
    "plotly>=6.7",
    "pandas>=2.3",
    "statsmodels>=0.14",
    "yfinance>=1.4",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.11",
    "mypy>=2.0",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "pip-tools>=7.0",
    "pip-audit>=2.7",
    "build>=1.0",
    "types-requests>=2.31",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["filter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_archive", "__pycache__", ".hypothesis"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "filter: filter algorithm tests",
    "signal: Schmitt trigger and signal tests",
    "strategy: PnL and strategy tests",
    "alignment: time alignment tests",
    "benchmark: performance regression benchmarks (pytest-benchmark)",
]

[tool.coverage.run]
source = ["filter"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
