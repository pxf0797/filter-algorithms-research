// ====== Helper Functions ======
function sigColor(s) {
  if (s === 1) return '#3fb950';
  if (s === -1) return '#f85149';
  return '#484f58';
}

function sigBgColor(s) {
  if (s === 1) return 'rgba(63,185,80,0.15)';
  if (s === -1) return 'rgba(248,81,73,0.15)';
  return 'rgba(72,79,88,0.1)';
}

function sigLabel(s) {
  if (s === 1) return '+1 做多';
  if (s === -1) return '-1 做空';
  return '0 空仓';
}

function formatPnL(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(2);
}

function formatPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
}

(function buildSignalCharts() {
  const versions = DATA.versions;
  const labels = DATA.labels;
  const colors = DATA.colors;
  const timestamps = DATA.timestamps;
  const sigs = DATA.sigs;

  // Create x-axis values as indices for cleaner display
  const xVals = timestamps.map((t, i) => i);

  const subplots = versions.map((v, idx) => {
    const s = sigs[v];
    const trace = {
      x: xVals,
      y: s,
      type: 'scatter',
      mode: 'lines',
      line: { shape: 'hv', width: 2, color: colors[v] },
      name: `${v} (${labels[v]})`,
      fill: 'tozeroy',
      fillcolor: 'rgba(128,128,128,0.05)',
      yaxis: `y${idx + 1}`,
      xaxis: `x${idx + 1}`,
      showlegend: false,
      hovertemplate: `${v}(${labels[v]})<br>Bar: %{x}<br>信号: %{y}<extra></extra>`
    };
    // Add colored background regions
    const shapes = [];
    for (let i = 0; i < s.length - 1; i++) {
      shapes.push({
        type: 'rect',
        x0: xVals[i], x1: xVals[i + 1],
        y0: -1.2, y1: 1.2,

        line: { width: 0 },
        layer: 'below',
        xref: `x${idx + 1}`,
        yref: `y${idx + 1}`

    margin: { l: 60, r: 40, t: 20, b: 40 },
    shapes: allShapes,

(function buildPnlChart() {
  const versions = DATA.versions;
  const labels = DATA.labels;
  const colors = DATA.colors;

  const traces = versions.map(v => {
    const pnl = DATA.pnl_long[v];
    const validPnl = [];
    const validX = [];
    pnl.forEach((p, i) => {
      if (p !== null && p !== undefined && !isNaN(p)) {
        validPnl.push(p);
        validX.push(i);
      }
    });
    const lastVal = validPnl[validPnl.length - 1];
    return {
      x: validX,
      y: validPnl,
      type: 'scatter',
      mode: 'lines',
      line: { width: 2, color: colors[v] },
      name: `${v} (${labels[v]})`,
      hovertemplate: `${v}(${labels[v]})<br>Bar: %{x}<br>PnL: %{y:.2f}<extra></extra>`,
      // Add end annotation marker
    };
  });

  // Add end-value annotations
  const annotations = versions.map(v => {
    const pnl = DATA.pnl_long[v];
    const valid = pnl.filter(p => p !== null && p !== undefined && !isNaN(p));
    if (valid.length === 0) return null;
    const lastIdx = pnl.lastIndexOf(valid[valid.length - 1]);
    return {
      x: lastIdx,
      y: valid[valid.length - 1],
      xref: 'x',
      yref: 'y',
      text: `${v}: ${valid[valid.length - 1].toFixed(2)}`,
      showarrow: true,
      arrowhead: 2,
      arrowsize: 1,
      arrowwidth: 1,
      arrowcolor: colors[v],
      ax: 30,
      ay: 0,
      font: { size: 11, color: colors[v] },
      bgcolor: 'rgba(13,17,23,0.8)',
      borderpad: 2
    };
  }).filter(Boolean);

  const layout = {
    height: 500,
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#0d1117',
    font: { color: '#8b949e', size: 11 },
    margin: { l: 60, r: 100, t: 20, b: 50 },
    legend: { x: 0.01, y: 0.99, font: { color: '#c9d1d9' }, bgcolor: 'rgba(22,27,34,0.8)' },
    xaxis: { title: 'Bar Index', showgrid: true, gridcolor: '#21262d', zeroline: false },
    yaxis: { title: '累计 PnL', showgrid: true, gridcolor: '#21262d', zeroline: true, zerolinecolor: '#30363d' },
    annotations: annotations
  };

  const config = { displayModeBar: false, responsive: true };
  Plotly.newPlot('chart-pnl', traces, layout, config);
})();

  const sigs = DATA.heatmap_sigs;

  const z = versions.map(v => sigs[v]);
  // Custom colorscale: -1=red, 0=gray, 1=green
  const customColorscale = [
    [0.0, '#f85149'],
    [0.49, '#f85149'],
    [0.5, '#484f58'],
    [0.51, '#3fb950'],
    [1.0, '#3fb950']
  ];

  const trace = {
    z: z,
    x: times,
    y: versions.map(v => `${v} (${labels[v]})`),
    type: 'heatmap',
    colorscale: customColorscale,
    zmin: -1,
    zmax: 1,
    showscale: true,
    colorbar: {
      title: '信号',
      tickvals: [-1, 0, 1],
      ticktext: ['-1 做空', '0 空仓', '+1 做多'],
      tickfont: { color: '#8b949e' },
      titlefont: { color: '#8b949e' },
      outlinecolor: '#30363d'
    },
    hovertemplate: '时间: %{x}<br>周期: %{y}<br>信号: %{z}<extra></extra>',
    xgap: 1,
    ygap: 2
  };

  const layout = {
    height: 300,
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#0d1117',
    font: { color: '#8b949e', size: 11 },
    margin: { l: 120, r: 80, t: 20, b: 60 },
    xaxis: {
      title: '时间 (采样)',
      showgrid: false,
      tickfont: { size: 9, color: '#484f58' },
      showticklabels: true,
      tickangle: -45,
      nticks: 20
    },
    yaxis: {
      showgrid: false,
      tickfont: { size: 12, color: '#c9d1d9' }
    }
  };

  const config = { displayModeBar: false, responsive: true };
  Plotly.newPlot('chart-heatmap', [trace], layout, config);
})();

// ====== Section 5: Statistics Table ======
(function buildTable() {
  const stats = DATA.stats;
  const labels = DATA.labels;
  const versions = DATA.versions;
  const colors = DATA.colors;

  function renderSummary() {
    let html = `<table>
      <thead><tr>
        <th>周期</th>
        <th>做多累计PnL</th>
        <th>做空累计PnL</th>
        <th>做多胜率</th>
        <th>最大回撤</th>
        <th>信号 +1</th>
        <th>信号 0</th>
        <th>信号 -1</th>
      </tr></thead><tbody>`;
    versions.forEach(v => {
      const s = stats[v];
      const posClass = s.long_total >= 0 ? 'positive' : 'negative';
      const shortClass = s.short_total >= 0 ? 'positive' : 'negative';
      html += `<tr>
        <td><span class="version-dot" style="background:${colors[v]}"></span> <strong>${v}</strong> <span style="color:#8b949e">(${labels[v]})</span></td>
        <td class="${posClass}">${formatPnL(s.long_total)}</td>
        <td class="${shortClass}">${formatPnL(s.short_total)}</td>
        <td>${formatPct(s.long_win_rate)}</td>
        <td>${s.max_dd.toFixed(2)}</td>
        <td class="sig-pos">${s.sig_counts['+1']}</td>
        <td class="sig-zero">${s.sig_counts['0']}</td>
        <td class="sig-neg">${s.sig_counts['-1']}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    return html;
  }

  function renderDetail(v) {
    const sigs = DATA.sigs[v];
    const pnlLong = DATA.pnl_long[v];
    const pnlShort = DATA.pnl_short[v];
    const eps = DATA.eps[v];
    const filtered = DATA.filtered[v];
    const longPos = DATA.long_pos[v];
    const shortPos = DATA.short_pos[v];
    const timestamps = DATA.timestamps;

    // Count trade events (position changes)
    const longEntries = [];
    const longExits = [];
    const shortEntries = [];
    const shortExits = [];

    for (let i = 1; i < longPos.length; i++) {
      if (longPos[i] && !longPos[i-1]) longEntries.push(i);
      if (!longPos[i] && longPos[i-1]) longExits.push(i);
      if (shortPos[i] && !shortPos[i-1]) shortEntries.push(i);
      if (!shortPos[i] && shortPos[i-1]) shortExits.push(i);
    }

    let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div style="padding:12px;background:#0d1117;border-radius:6px">
        <div style="color:#8b949e;font-size:12px;margin-bottom:8px">做多交易统计</div>
        <div>开仓次数: <strong>${longEntries.length}</strong></div>
        <div>平仓次数: <strong>${longExits.length}</strong></div>
      </div>
      <div style="padding:12px;background:#0d1117;border-radius:6px">
        <div style="color:#8b949e;font-size:12px;margin-bottom:8px">做空交易统计</div>
        <div>开仓次数: <strong>${shortEntries.length}</strong></div>
        <div>平仓次数: <strong>${shortExits.length}</strong></div>
      </div>
    </div>`;

    html += `<table>
      <thead><tr>
        <th>#</th>
        <th>时间</th>
        <th>信号</th>
        <th>Filtered</th>
        <th>EPS</th>
        <th>做多PnL</th>
        <th>做空PnL</th>
        <th>做多持仓</th>
        <th>做空持仓</th>
      </tr></thead><tbody>`;

    // Show first 50 + last 50, with ... in middle
    const total = sigs.length;
    const showCount = 30;
    const indices = [];
    for (let i = 0; i < Math.min(showCount, total); i++) indices.push(i);
    if (total > showCount * 2) {
      indices.push(-1); // marker
      for (let i = total - showCount; i < total; i++) indices.push(i);
    } else {
      for (let i = showCount; i < total; i++) indices.push(i);
    }

    for (const idx of indices) {
      if (idx === -1) {
        html += `<tr><td colspan="9" style="text-align:center;color:#8b949e;padding:12px">... 省略 ${total - showCount * 2} 行 ...</td></tr>`;
        continue;
      }
      const s = sigs[idx];
      const sigClass = s === 1 ? 'sig-pos' : s === -1 ? 'sig-neg' : 'sig-zero';
      html += `<tr>
        <td style="color:#484f58">${idx}</td>
        <td style="font-size:12px;color:#8b949e">${timestamps[idx]}</td>
        <td class="${sigClass}">${sigLabel(s)}</td>
        <td>${filtered[idx] !== null ? filtered[idx].toFixed(2) : '—'}</td>
        <td>${eps[idx] !== null ? eps[idx].toFixed(4) : '—'}</td>
        <td>${pnlLong[idx] !== null ? pnlLong[idx].toFixed(2) : '—'}</td>
        <td>${pnlShort[idx] !== null ? pnlShort[idx].toFixed(2) : '—'}</td>
        <td>${longPos[idx] ? '<span class="badge badge-long">做多</span>' : '<span style="color:#484f58">—</span>'}</td>
        <td>${shortPos[idx] ? '<span class="badge badge-short">做空</span>' : '<span style="color:#484f58">—</span>'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    return html;
  }

  // Initial render
  document.getElementById('table-content').innerHTML = renderSummary();

  // Tab switching
  document.getElementById('table-tabs').addEventListener('click', function(e) {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('#table-tabs .tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const tab = e.target.dataset.tab;
    if (tab === 'summary') {
      document.getElementById('table-content').innerHTML = renderSummary();
    } else {
      document.getElementById('table-content').innerHTML = renderDetail(tab);
    }
  });
})();
</script>
</body>
</html>
